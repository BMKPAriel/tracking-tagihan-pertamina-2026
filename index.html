<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracking Tagihan — Unit Rate Isolasi BMKP 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --arang:#181A1F; --arang2:#22262E; --garis:#E2E7EF;
  --merah:#C8102E; --merah-tua:#8E0B20; --emas:#E8A317;
  --cepat:#12A150; --normal:#F5A524; --lambat:#E5484D; --biru:#2563EB;
  --latar:#F2F5FA; --kartu:#FFFFFF; --teks:#181A1F; --teks2:#616B7C;
  --r:14px; --bayang:0 1px 2px rgba(24,26,31,.06), 0 8px 24px rgba(24,26,31,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--latar);color:var(--teks);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:15px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.02em}
a{color:var(--biru)}

/* ====== LOGO ====== */
.logo-kotak{background:#fff;border-radius:12px;padding:5px 8px;display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.logo-kotak img{height:38px;width:auto;display:block}
.logo-teks{font-weight:800;font-size:19px;letter-spacing:-.04em;color:var(--merah);line-height:1}
.logo-teks small{display:block;font-size:8px;letter-spacing:.12em;color:var(--arang);font-weight:700}

/* ====== GERBANG ====== */
#gerbang{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 20% -10%, #3A0A14 0%, #181A1F 55%, #101216 100%)}
.gerbang-kotak{width:100%;max-width:420px;background:var(--kartu);border-radius:20px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.gerbang-kotak h1{font-size:23px;font-weight:800;margin-top:16px}
.gerbang-kotak p{color:var(--teks2);margin:6px 0 20px;font-size:14px}
.baris-form{margin-bottom:14px}
.baris-form label{display:block;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--teks2);margin-bottom:6px}
.baris-form input,.baris-form select,.baris-form textarea{width:100%;padding:11px 12px;border:1.5px solid var(--garis);border-radius:10px;background:#fff;outline:none}
.baris-form input:focus,.baris-form select:focus,.baris-form textarea:focus{border-color:var(--merah);box-shadow:0 0 0 3px rgba(200,16,46,.12)}
.tbl-utama{width:100%;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--merah),var(--merah-tua));color:#fff;font-weight:800;cursor:pointer;font-size:15px}
.tbl-utama:hover{filter:brightness(1.08)}
.galat{background:#FEECEE;color:#8E0B20;padding:10px 12px;border-radius:10px;font-weight:600;margin-bottom:12px;display:none}

/* ====== KEPALA ====== */
header{background:linear-gradient(120deg,#181A1F 0%,#2A0C14 45%,#8E0B20 100%);color:#fff;padding:16px 22px 0}
.kepala-atas{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;max-width:1780px;margin:0 auto}
.judul-blok{display:flex;gap:14px;align-items:center}
.judul-blok h1{font-size:19px;font-weight:800}
.judul-blok span{font-size:11.5px;opacity:.75;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.pengguna{display:flex;gap:8px;align-items:center;font-size:13px}
.lencana{background:rgba(255,255,255,.14);padding:7px 14px;border-radius:999px;font-weight:700;border:1px solid rgba(255,255,255,.22)}
.tbl-keluar{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 13px;border-radius:999px;cursor:pointer;font-weight:700}
.tbl-keluar:hover{background:rgba(255,255,255,.12)}
nav{max-width:1780px;margin:14px auto 0;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav::-webkit-scrollbar{height:0}
.pil{background:rgba(255,255,255,.10);color:#fff;border:0;padding:11px 18px;border-radius:12px 12px 0 0;cursor:pointer;font-weight:700;white-space:nowrap;opacity:.82;font-size:14px}
.pil:hover{background:rgba(255,255,255,.2);opacity:1}
.pil.aktif{background:var(--latar);color:var(--merah);opacity:1}
.pil .titik{display:inline-block;background:var(--emas);color:#181A1F;border-radius:999px;padding:0 7px;margin-left:7px;font-size:12px}

main{max-width:1780px;margin:0 auto;padding:22px}
.halaman{display:none}
.halaman.aktif{display:block}
.judul-hal{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin-bottom:18px}
.judul-hal h2{font-size:24px;font-weight:800}
.judul-hal p{margin:5px 0 0;color:var(--teks2);font-size:14px}

/* ====== KARTU ====== */
.kartu{background:var(--kartu);border-radius:var(--r);box-shadow:var(--bayang);padding:20px;margin-bottom:18px}
.kartu h3{font-size:16px;font-weight:800;margin-bottom:14px}
.kisi{display:grid;gap:16px}
.kisi-4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kisi-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kisi-2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.kpi{border-radius:var(--r);padding:22px;color:#fff;box-shadow:var(--bayang)}
.kpi .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.88}
.kpi .ang{font-size:34px;font-weight:800;margin-top:8px;letter-spacing:-.035em;line-height:1.05}
.kpi .sub{font-size:13px;opacity:.9;margin-top:6px}
.k-merah{background:linear-gradient(135deg,#E5484D,#8E0B20)}
.k-hijau{background:linear-gradient(135deg,#22C55E,#0B7A3B)}
.k-emas{background:linear-gradient(135deg,#F5A524,#B26B00)}
.k-biru{background:linear-gradient(135deg,#3B82F6,#1D4ED8)}
.k-ungu{background:linear-gradient(135deg,#8B5CF6,#5B21B6)}
.k-arang{background:linear-gradient(135deg,#3F4654,#181A1F)}

/* ====== REL ====== */
.rel-blok{border:1px solid var(--garis);border-radius:var(--r);padding:16px;margin-bottom:12px;background:#fff}
.rel-kepala{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:start;margin-bottom:12px}
.rel-nama{font-weight:800;font-size:16px}
.rel-meta{font-size:13px;color:var(--teks2);margin-top:2px}
.rel-nilai{font-weight:800;font-family:'JetBrains Mono',monospace;font-size:15px}
.rel{display:flex;align-items:center;overflow-x:auto;padding:6px 0 10px}
.stop{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;border:2px solid var(--garis);background:#fff;color:var(--teks2)}
.stop.done{background:var(--cepat);border-color:var(--cepat);color:#fff}
.stop.done.telat{background:var(--normal);border-color:var(--normal)}
.stop.done.jauh{background:var(--lambat);border-color:var(--lambat)}
.stop.kini{background:#fff;border-color:var(--merah);color:var(--merah);box-shadow:0 0 0 4px rgba(200,16,46,.15);animation:denyut 2s infinite}
@keyframes denyut{0%,100%{box-shadow:0 0 0 4px rgba(200,16,46,.15)}50%{box-shadow:0 0 0 9px rgba(200,16,46,.05)}}
.sambung{flex:1;min-width:12px;height:3px;background:var(--garis)}
.sambung.done{background:var(--cepat)}
.rel-kaki{display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-size:13px;border-top:1px dashed var(--garis);padding-top:11px}

.chip{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.c-cepat{background:#DCFCE7;color:#0B7A3B}
.c-normal{background:#FEF3C7;color:#92400E}
.c-lambat{background:#FEE2E2;color:#991B1B}
.c-netral{background:#EEF2F7;color:#4B5563}
.c-biru{background:#DBEAFE;color:#1E40AF}
.c-lunas{background:#111827;color:#FDE68A}

/* ====== TABEL ====== */
.gulung{overflow:auto;border:1px solid var(--garis);border-radius:12px;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{padding:9px 11px;border-bottom:1px solid var(--garis);text-align:left;vertical-align:top}
thead th{position:sticky;top:0;background:#F8FAFC;z-index:3;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--teks2);font-weight:800;border-bottom:2px solid var(--garis)}
thead th.pic-th{background:#EEF2F7;color:var(--arang)}
tbody tr:hover{background:#FAFBFE}
.beku{position:sticky;left:0;background:#fff;z-index:2;min-width:210px;box-shadow:2px 0 0 var(--garis)}
thead .beku{z-index:4;background:#F8FAFC}
.beku1{position:sticky;left:0;background:#fff;z-index:2;width:46px;min-width:46px;text-align:center;font-weight:800}
.beku2{position:sticky;left:46px;background:#fff;z-index:2;min-width:215px;box-shadow:2px 0 0 var(--garis)}
thead .beku1,thead .beku2{z-index:5;background:#F8FAFC}
.beku-kanan{position:sticky;right:0;background:#fff;z-index:2;min-width:300px;box-shadow:-3px 0 0 var(--garis)}
thead .beku-kanan{z-index:5;background:#F8FAFC}
tr.grup td{background:linear-gradient(90deg,#FDE9EC,#FFF7F8);font-weight:800;font-size:13px;letter-spacing:.04em;
  position:sticky;left:0;color:var(--merah-tua);text-transform:uppercase;padding:9px 12px}
.hadir-bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:14px;font-size:13px}
.hadir-tit{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--merah);color:#fff;font-weight:800;font-size:11px}
.hadir-org{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--garis);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700}
.kunci-pesan{background:#FEF3C7;border-left:4px solid var(--normal);padding:12px 15px;border-radius:0 10px 10px 0;font-weight:700;color:#92400E;margin-bottom:14px}
.server-lampu{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9AA4B2;margin-right:6px}
.server-lampu.hidup{background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.server-lampu.mati{background:#E5484D}
td.sel{white-space:nowrap;text-align:center}
td.sel .tgl{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12.5px}
td.sel .dur{font-size:11px;font-weight:800;margin-top:2px}
.s-cepat{background:#F0FDF4}.s-normal{background:#FFFBEB}.s-lambat{background:#FEF2F2}
.s-kini{background:#FFF1F2;outline:2px solid var(--merah);outline-offset:-2px}
.kosong{text-align:center;padding:44px 20px;color:var(--teks2);font-size:15px}

/* ====== TOMBOL ====== */
.tbl{border:1.5px solid var(--garis);background:#fff;padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--teks)}
.tbl:hover{border-color:var(--merah);color:var(--merah)}
.tbl.isi{background:var(--merah);border-color:var(--merah);color:#fff}
.tbl.isi:hover{filter:brightness(1.1);color:#fff}
.tbl.kecil{padding:5px 10px;font-size:12.5px;border-radius:8px}
.tbl.hijau{background:var(--cepat);border-color:var(--cepat);color:#fff}
.tbl.hijau:hover{color:#fff;filter:brightness(1.08)}
.tbl:disabled{opacity:.45;cursor:not-allowed}
.alat{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}
.alat input,.alat select{padding:9px 11px;border:1.5px solid var(--garis);border-radius:10px;background:#fff}

/* ====== KPI ORANG ====== */
.orang{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px;border:1px solid var(--garis);border-radius:var(--r);margin-bottom:11px;background:#fff}
.medali{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:var(--arang2)}
.m1{background:linear-gradient(135deg,#FFD54A,#C98B00)}.m2{background:linear-gradient(135deg,#D5DBE3,#8B95A3)}.m3{background:linear-gradient(135deg,#E3A76F,#9C5C21)}
.orang-nama{font-weight:800;font-size:16px}
.orang-sub{font-size:13px;color:var(--teks2)}
.bar{height:9px;background:#EEF2F7;border-radius:999px;overflow:hidden;margin-top:9px;max-width:460px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--merah),var(--emas))}
.skor{text-align:right}
.skor b{font-size:28px;font-weight:800;display:block;letter-spacing:-.03em}
.skor span{font-size:12px;font-weight:700;color:var(--teks2)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin-top:11px}
.mini div{background:#F8FAFC;border-radius:10px;padding:9px;text-align:center}
.mini b{display:block;font-size:18px;font-weight:800}
.mini span{font-size:11px;color:var(--teks2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

/* ====== TUGAS / PERINGATAN ====== */
.tugas{border-left:6px solid var(--merah);background:#fff;border-radius:12px;padding:18px;margin-bottom:13px;box-shadow:var(--bayang)}
.tugas.aman{border-left-color:var(--cepat)}
.tugas.awas{border-left-color:var(--normal)}
.tugas-kepala{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.tugas-aksi{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:13px;padding-top:13px;border-top:1px dashed var(--garis)}
.tugas-aksi input[type=date]{padding:9px 11px;border:1.5px solid var(--garis);border-radius:10px}

/* ====== MONITOR MEETING ====== */
.monitor{background:linear-gradient(150deg,#12141A,#22101A 60%,#3A0A14);border-radius:18px;padding:26px;color:#fff}
.monitor h2{font-size:26px}
.mon-kisi{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-top:20px}
.mon-kartu{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:18px}
.mon-kartu.merah{border-color:rgba(229,72,77,.6);background:rgba(229,72,77,.12)}
.mon-nama{font-weight:800;font-size:18px}
.mon-meta{font-size:13px;opacity:.7;margin-top:3px}
.mon-nilai{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;margin-top:12px;color:var(--emas)}
.mon-baris{display:flex;justify-content:space-between;font-size:13.5px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
.mon-angka{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.mon-angka div{background:rgba(255,255,255,.07);border-radius:12px;padding:14px}
.mon-angka b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em}
.mon-angka span{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:.07em;font-weight:700}

.tirai{position:fixed;inset:0;background:rgba(24,26,31,.55);z-index:800;display:none;align-items:center;justify-content:center;padding:16px}
.tirai.buka{display:flex}
.jendela{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.jendela h3{font-size:18px;font-weight:800;margin-bottom:14px}
.jendela-kaki{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.rumus{background:#181A1F;color:#E7EDF5;padding:13px 15px;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;overflow-x:auto;margin:9px 0;white-space:pre}

.roti{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(140px);background:var(--arang);color:#fff;padding:13px 22px;border-radius:999px;font-weight:700;z-index:950;transition:transform .25s;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.roti.tampil{transform:translateX(-50%) translateY(0)}
.sembunyi{display:none !important}
@media (max-width:640px){
  .orang{grid-template-columns:auto 1fr}
  .skor{grid-column:1/-1;text-align:left;display:flex;gap:12px;align-items:baseline}
  main{padding:14px}
  .kpi .ang{font-size:26px}
  .judul-hal h2{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="gerbang">
  <div class="gerbang-kotak">
    <div class="logo-kotak" style="width:fit-content" id="logo-masuk"></div>
    <h1>Tracking Tagihan</h1>
    <p>Unit rate isolasi — PT. Bumimarga Kharisma Perkasa · 2026</p>
    <div class="galat" id="galat-masuk"></div>
    <div class="baris-form">
      <label for="pilih-nama">Nama</label>
      <select id="pilih-nama"></select>
    </div>
    <div class="baris-form">
      <label for="isi-sandi">Kata sandi</label>
      <input type="password" id="isi-sandi" placeholder="Masukkan sandi Anda" autocomplete="current-password">
    </div>
    <label style="display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:18px;cursor:pointer">
      <input type="checkbox" id="ingat-saya" checked> Ingat saya di perangkat ini
    </label>
    <button class="tbl-utama" id="tbl-masuk">Masuk</button>
  </div>
</div>

<div id="aplikasi" class="sembunyi">
<header>
  <div class="kepala-atas">
    <div class="judul-blok">
      <div class="logo-kotak" id="logo-kepala"></div>
      <div>
        <h1>Tracking Tagihan</h1>
        <span>Unit Rate Isolasi · MA1 · MA2 · MA3 · BMKP 2026</span>
      </div>
    </div>
    <div class="pengguna">
      <span class="lencana" id="lencana-pengguna">—</span>
      <button class="tbl-keluar" id="tbl-keluar">Keluar</button>
    </div>
  </div>
  <nav id="nav"></nav>
</header>

<main>
  <div class="halaman aktif" id="hal-rekap"></div>
  <div class="halaman" id="hal-monitor"></div>
  <div class="halaman" id="hal-papan"></div>
  <div class="halaman" id="hal-finance"></div>
  <div class="halaman" id="hal-input"></div>
  <div class="halaman" id="hal-tugas"></div>
  <div class="halaman" id="hal-kpi"></div>
  <div class="halaman" id="hal-lunas"></div>
  <div class="halaman" id="hal-atur"></div>
</main>
</div>

<div class="tirai" id="tirai"><div class="jendela" id="jendela"></div></div>
<div class="roti" id="roti"></div>
<script>
/* =======================================================================
   TRACKING TAGIHAN — mesin data

const BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function hariIni(){ return iso(new Date()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function keDate(s){ if(!s) return null; const p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function tglRapi(s){ if(!s) return '—'; const d=keDate(s); return String(d.getDate()).padStart(2,'0')+' '+BULAN[d.getMonth()]+' '+d.getFullYear(); }
function tglPendek(s){ if(!s) return '—'; const d=keDate(s); return String(d.getDate()).padStart(2,'0')+' '+BULAN[d.getMonth()]; }
function liburSet(){ if(!CACHE_LIBUR){ CACHE_LIBUR=new Set((DB.libur||[]).map(l=>l.tgl)); } return CACHE_LIBUR; }
function hariKerja(a,b){ const d1=keDate(a),d2=keDate(b); if(!d1||!d2) return null;
  return d2<d1? -hitungHK(d2,d1) : hitungHK(d1,d2); }
function hitungHK(d1,d2){ const lib=liburSet(); let n=0; const k=new Date(d1); k.setDate(k.getDate()+1);
  while(k<=d2){ const h=k.getDay(); if(h!==0&&h!==6&&!lib.has(iso(k))) n++; k.setDate(k.getDate()+1); } return n; }

function cariTahap(no){ return DB.tahapan.find(t=>t.no===no); }

function hitung(t){
  const T=DB.tahapan, N=T.length;
  const isi=no=>t.tgl[no]||t.tgl[String(no)]||null;
  const langkah=[]; let tglSebelum=null, mulai=null;
  for(const th of T){
    const tgl=isi(th.no);
    const l={no:th.no,nama:th.nama,pic:th.pic,target:th.target,tgl:tgl,durasi:null,status:'kosong',selisih:null};
    if(tgl){
      if(!mulai) mulai=tgl;
      if(tglSebelum===null){ l.durasi=0; l.status='mulai'; }
      else{ l.durasi=hariKerja(tglSebelum,tgl); l.selisih=l.durasi-th.target;
        l.status = l.durasi<th.target?'cepat':(l.durasi===th.target?'normal':'lambat'); }
      tglSebelum=tgl;
    }
    langkah.push(l);
  }
  const terisi=langkah.filter(l=>l.tgl).length;
  const tahapKini=langkah.find(l=>!l.tgl);
  const selesai=!tahapKini;
  const bolong=langkah.some((l,i)=>!l.tgl&&langkah.slice(i+1).some(x=>x.tgl));
  let umur=null,lewat=null,picKini=null,namaKini='LUNAS / SELESAI';
  if(selesai){ umur=mulai?hariKerja(mulai,tglSebelum):null; picKini=cariTahap(N).pic; }
  else if(terisi===0){ namaKini='Belum mulai'; picKini=T[0].pic; umur=0; }
  else{ picKini=tahapKini.pic; namaKini=tahapKini.nama; umur=hariKerja(mulai,hariIni());
    const jalan=hariKerja(tglSebelum,hariIni()); lewat=jalan-tahapKini.target; tahapKini.berjalan=jalan; }
  return {langkah,terisi,total:N,selesai,tahapKini,namaKini,picKini,umur,lewat,mulai,tglAkhir:tglSebelum,bolong};
}

const URUT_AREA=['MA1','MA2','MA3','MA2+MA3','LTSA'];
function indeksArea(a){ const i=URUT_AREA.indexOf(a||''); return i<0?99:i; }
function urutkan(arr){
  return arr.slice().sort((x,y)=>{
    const d=indeksArea(x.t.area)-indeksArea(y.t.area);
    if(d) return d;
    return (x.t.nama||'').localeCompare(y.t.nama||'',{numeric:true});
  });
}
function semua(){ return urutkan(DB.tagihan.map(t=>({t,h:hitung(t)}))); }
function outstanding(){ return semua().filter(x=>!x.h.selesai); }
function lunasSaja(){ return semua().filter(x=>x.h.selesai); }
function telat(){ return outstanding().filter(x=>x.h.lewat>0).sort((a,b)=>b.h.lewat-a.h.lewat); }
function rupiah(n){ return 'Rp '+Number(n||0).toLocaleString('id-ID'); }
function rupiahSingkat(n){ n=Number(n)||0;
  if(n>=1e9) return 'Rp '+(n/1e9).toFixed(2).replace('.',',')+' M';
  if(n>=1e6) return 'Rp '+Math.round(n/1e6)+' Jt'; return rupiah(n); }

function kpiOrang(){
  const peta={};
  const pastikan=n=>{ if(!peta[n]) peta[n]={nama:n,selesai:0,tepat:0,lambat:0,totalHari:0,totalTarget:0,telatHari:0,aktif:0,aktifLewat:0,rinci:[]}; return peta[n]; };
  DB.tahapan.forEach(th=>pastikan(th.pic));
  semua().forEach(({t,h})=>{
    h.langkah.forEach(l=>{
      if(l.tgl&&l.status!=='mulai'&&l.status!=='kosong'){
        const o=pastikan(l.pic); o.selesai++; o.totalHari+=l.durasi; o.totalTarget+=l.target;
        if(l.durasi<=l.target) o.tepat++; else { o.lambat++; o.telatHari+=(l.durasi-l.target); }
        o.rinci.push({tagihan:t.nama,tahap:l.nama,durasi:l.durasi,target:l.target,status:l.status,tgl:l.tgl});
      }});
    if(!h.selesai&&h.tahapKini&&h.terisi>0){ const o=pastikan(h.picKini); o.aktif++;
      if(h.lewat>0){ o.aktifLewat++; } }
  });
  const daftar=Object.values(peta).map(o=>{
    o.ketepatan=o.selesai?(o.tepat/o.selesai*100):null;
    o.rerata=o.selesai?(o.totalHari/o.selesai):null;
    o.rerataTarget=o.selesai?(o.totalTarget/o.selesai):null;
    const sK=o.selesai?60*(o.tepat/o.selesai):0;
    let efis=0; if(o.selesai){ let j=0; o.rinci.forEach(r=>{ j+=Math.min(1,r.durasi<=0?1:(r.target/Math.max(r.durasi,0.5))); }); efis=j/o.selesai; }
    const sC=25*efis, sD=Math.max(0,15-3*o.aktifLewat);
    o.skor=(o.selesai||o.aktif)?Math.round(sK+sC+sD):0;
    o.komponen={ketepatan:Math.round(sK),kecepatan:Math.round(sC),disiplin:sD};
    o.predikat=o.skor>=85?'Sangat Baik':o.skor>=70?'Baik':o.skor>=55?'Cukup':'Perlu Perbaikan';
    o.tugasTahap=DB.tahapan.filter(th=>th.pic===o.nama).length;
    return o;
  });
  daftar.sort((a,b)=>b.skor-a.skor||b.selesai-a.selesai);
  return daftar;
}

function relHTML(h){
  let o='<div class="rel">';
  h.langkah.forEach((l,i)=>{
    let k='stop';
    if(l.tgl){ k+=' done'; if(l.status==='lambat') k+=(l.selisih>l.target)?' jauh':' telat'; }
    else if(h.tahapKini&&l.no===h.tahapKini.no) k+=' kini';
    const ket=l.tgl?`${l.nama} · ${l.pic} · ${tglRapi(l.tgl)}${l.status!=='mulai'?` · ${l.durasi} hari (target ${l.target})`:' · mulai'}`
                   :`${l.nama} · ${l.pic} · belum diisi (target ${l.target} hari)`;
    o+=`<div class="${k}" title="${esc(ket)}">${l.no}</div>`;
    if(i<h.langkah.length-1) o+=`<div class="sambung ${l.tgl?'done':''}"></div>`;
  });
  return o+'</div>';
}
function chipPosisi(h){

  return `<span class="chip c-cepat">DALAM TARGET · ${esc(h.picKini).toUpperCase()}</span>`;
}

    </div>

    <div style="margin-top:26px;display:flex;flex-wrap:wrap;gap:10px">
      ${areaUrut.map(a=>{
        const g=grup[a], t=g.filter(x=>x.h.lewat>0).length;
        return `<div style="background:rgba(255,255,255,.07);border-left:4px solid ${warnaArea[a]||'#9AA4B2'};border-radius:10px;padding:10px 16px">
          <div style="font-weight:800;font-size:15px">${esc(a)}</div>
          <div style="font-size:12.5px;opacity:.75">${g.length} tagihan · ${rupiahSingkat(n(g))}${t?` · <b style="color:#FF8B8F">${t} telat</b>`:''}</div>

    ${areaUrut.map(a=>{

/* ---------- 3. PAPAN TRACKING (hanya outstanding, terurut per area) ---------- */
let sArea='semua', sStatus='semua', sPic='semua', ringkas=false;
function gPapan(){
  let d=outstanding();
  if(sArea!=='semua') d=d.filter(x=>(x.t.area||'')===sArea);
  if(sPic!=='semua') d=d.filter(x=>x.h.picKini===sPic);
  if(sStatus==='lewat') d=d.filter(x=>x.h.lewat>0);
  if(sStatus==='aman') d=d.filter(x=>x.h.terisi>0&&x.h.lewat<=0);
  if(sStatus==='belum') d=d.filter(x=>x.h.terisi===0);
  const area=[...new Set(DB.tagihan.map(t=>t.area).filter(Boolean))].sort((a,b)=>indeksArea(a)-indeksArea(b));
  const picList=[...new Set(DB.tahapan.map(t=>t.pic))];
  const lebarSel = ringkas? 74 : 110;
  const jmlKolom = DB.tahapan.length+3;

  const kepala=DB.tahapan.map(th=>`<th class="pic-th" style="min-width:${lebarSel}px;text-align:center">
    <div style="font-size:11px;color:var(--merah)">${th.no}</div>
    <div style="font-size:${ringkas?'10px':'11.5px'};line-height:1.25">${esc(ringkas?th.nama.split(' ').slice(0,2).join(' '):th.nama)}</div>
    <div style="font-weight:700;color:var(--teks2);text-transform:none;font-size:10px">${esc(th.pic)} · ${th.target}h</div></th>`).join('');

  let no=0, areaTerakhir=null, isi='';
  d.forEach(({t,h})=>{
    const a=t.area||'—';
    if(a!==areaTerakhir){
      const nilaiArea=d.filter(x=>(x.t.area||'—')===a).reduce((s,x)=>s+(x.t.nilai||0),0);
      const jmlArea=d.filter(x=>(x.t.area||'—')===a).length;
      isi+=`<tr class="grup"><td colspan="${jmlKolom}">AREA ${esc(a)} — ${jmlArea} tagihan · ${rupiah(nilaiArea)}</td></tr>`;
      areaTerakhir=a;
    }
    no++;
    const sel=h.langkah.map(l=>{
      if(!l.tgl){
        const kini=h.tahapKini&&l.no===h.tahapKini.no;
        return `<td class="sel ${kini?'s-kini':''}">${kini?
          `<div style="font-size:11.5px;font-weight:800;color:var(--merah)">DI SINI</div>
           <div style="font-size:11px;color:${h.lewat>0?'var(--lambat)':'var(--teks2)'};font-weight:700">${h.lewat>0?'+'+h.lewat+' hari':(h.tahapKini.berjalan||0)+'/'+l.target+'h'}</div>
           ${bisaIsiTahap(l.no)?`<button class="tbl kecil" style="margin-top:4px;padding:3px 8px;font-size:11px" data-isi="${t.id}" data-t="${l.no}">Isi</button>`:''}`
          :'<span style="color:#C7CFDA">—</span>'}</td>`;
      }
      const k=l.status==='mulai'?'':'s-'+(l.status==='cepat'?'cepat':l.status==='normal'?'normal':'lambat');
      const w=l.status==='cepat'?'var(--cepat)':l.status==='normal'?'#B45309':l.status==='lambat'?'var(--lambat)':'var(--teks2)';
      return `<td class="sel ${k}">
        <div class="tgl">${ringkas?tglPendek(l.tgl):tglRapi(l.tgl)}</div>
        <div class="dur" style="color:${w}">${l.status==='mulai'?'START':`${l.durasi}h · ${l.status.toUpperCase()}`}</div>
        ${bisaInput()?`<button class="tbl kecil" style="margin-top:3px;padding:2px 7px;font-size:10.5px" data-isi="${t.id}" data-t="${l.no}">ubah</button>`:''}
      </td>`;
    }).join('');
    isi+=`<tr>
      <td class="beku1 mono">${no}</td>
      <td class="beku2"><b style="font-size:14px">${esc(t.nama)}</b>
        <div style="font-size:12px;color:var(--teks2)">${esc(t.periode||'')}</div>
        <div class="mono" style="font-size:12.5px;margin-top:3px;font-weight:700">${rupiah(t.nilai)}</div></td>
      ${sel}
      <td class="beku-kanan">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <span style="font-size:11px;font-weight:800;color:var(--teks2);text-transform:uppercase;letter-spacing:.05em">Total hari kerja</span>
          <b class="mono" style="font-size:19px">${h.umur==null?'—':h.umur}</b>
        </div>
        <div style="margin-top:7px;font-size:11px;font-weight:800;color:var(--teks2);text-transform:uppercase;letter-spacing:.05em">Posisi sekarang</div>
        <div style="margin-top:3px">${chipPosisi(h)}</div>
        <div style="font-size:12.5px;font-weight:700;margin-top:4px">${h.tahapKini?h.tahapKini.no+'. ':''}${esc(h.namaKini)}</div>
        <div style="margin-top:9px;font-size:11px;font-weight:800;color:var(--teks2);text-transform:uppercase;letter-spacing:.05em">Keterangan / kendala</div>
        <div style="font-size:12.5px;color:var(--teks2);margin-top:2px;line-height:1.45">${esc(t.catatan||'—')}</div>
        ${(bisaInput()||bisaPeringatan())?`<button class="tbl kecil" style="margin-top:8px" data-catatan="${t.id}">Perbarui kendala</button>`:''}
      </td>
    </tr>`;
  });

  $('#hal-papan').innerHTML=`
  <div class="judul-hal">
    <div><h2>Papan tracking</h2><p>Hanya tagihan <b>outstanding</b>, terurut otomatis per area: MA1 → MA2 → MA3 → MA2+MA3 → LTSA. ${d.length} tagihan × 14 tahapan.</p></div>
    <div style="display:flex;gap:9px">
      <button class="tbl" id="tbl-ringkas">${ringkas?'Tampilan lengkap':'Rapatkan kolom'}</button>
      <button class="tbl" id="tbl-csv">Unduh CSV</button>
    </div>
  </div>
  <div id="bar-hadir-papan"></div>
  <div class="alat">
    <select id="f-area"><option value="semua">Semua area</option>${area.map(a=>`<option ${sArea===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
    <select id="f-pic"><option value="semua">Semua PIC</option>${picList.map(p=>`<option ${sPic===p?'selected':''}>${esc(p)}</option>`).join('')}</select>
    <select id="f-status">
      <option value="semua" ${sStatus==='semua'?'selected':''}>Semua status</option>
      <option value="lewat" ${sStatus==='lewat'?'selected':''}>Lewat target</option>
      <option value="aman" ${sStatus==='aman'?'selected':''}>Masih dalam target</option>
      <option value="belum" ${sStatus==='belum'?'selected':''}>Belum mulai</option>
    </select>
    <span class="chip c-cepat">CEPAT</span><span class="chip c-normal">NORMAL</span><span class="chip c-lambat">LAMBAT</span>
    <span style="color:var(--teks2);font-size:13px">angka = hari kerja terpakai di tahapan itu</span>
  </div>
  <div class="gulung">
    <table>
      <thead><tr><th class="beku1">No</th><th class="beku2">Nama tagihan</th>${kepala}
      <th class="beku-kanan">Total hari · posisi · kendala</th></tr></thead>
      <tbody>${isi||`<tr><td colspan="${jmlKolom}" class="kosong">Tidak ada tagihan outstanding yang cocok dengan saringan.</td></tr>`}</tbody>
    </table>
  </div>`;
  $('#f-area').onchange=e=>{sArea=e.target.value;gPapan();};
  $('#f-pic').onchange=e=>{sPic=e.target.value;gPapan();};
  $('#f-status').onchange=e=>{sStatus=e.target.value;gPapan();};
  $('#tbl-ringkas').onclick=()=>{ringkas=!ringkas;gPapan();};
  $('#tbl-csv').onclick=()=>unduhCSV(false);
  document.querySelectorAll('[data-isi]').forEach(b=>b.onclick=()=>formIsiTanggal(b.dataset.isi,+b.dataset.t));
  document.querySelectorAll('[data-catatan]').forEach(b=>b.onclick=()=>formCatatan(b.dataset.catatan));
  gambarHadir('#bar-hadir-papan');
}

function unduhCSV(termasukLunas){
  const sumber=termasukLunas?semua():outstanding();
  const baris=[['Nama tagihan','Periode','Area','Nilai',...DB.tahapan.map(t=>`${t.no}. ${t.nama} (${t.pic})`),'Umur (hari kerja)','Posisi sekarang','PIC sekarang','Hari lewat','Keterangan']];
  sumber.forEach(({t,h})=>baris.push([t.nama,t.periode||'',t.area||'',t.nilai||0,
    ...h.langkah.map(l=>l.tgl?tglRapi(l.tgl):''),h.umur==null?'':h.umur,h.namaKini,h.picKini||'',h.lewat>0?h.lewat:'',t.catatan||'']));
  const csv=baris.map(r=>r.map(s=>`"${String(s).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='Tracking_Tagihan_'+(termasukLunas?'Semua_':'Outstanding_')+hariIni()+'.csv'; a.click();
  roti('CSV terunduh.');
}

/* ---------- 4. TUGAS ATI FINANCE ---------- */
function gFinance(){
  const tl=telat(), out=outstanding();
  const aman=out.filter(x=>x.h.terisi>0&&x.h.lewat<=0);
  const belum=out.filter(x=>x.h.terisi===0);
  const nilaiTertahan=tl.reduce((s,x)=>s+(x.t.nilai||0),0);
  const hanyaLihat=P()==='bos';

  $('#hal-finance').innerHTML=`
  <div class="judul-hal">
    <div><h2>Tugas Ati — Finance</h2>
    <p>Daftar tagihan yang sudah lewat target dan perlu diingatkan ke PIC-nya hari ini.</p></div>
  </div>

  <div id="bar-hadir-finance"></div>
  <div class="kisi kisi-4" style="margin-bottom:18px">
    <div class="kpi k-merah"><div class="lab">Perlu diingatkan</div><div class="ang">${tl.length}</div><div class="sub">tagihan lewat target</div></div>
    <div class="kpi k-emas"><div class="lab">Nilai tertahan</div><div class="ang">${rupiahSingkat(nilaiTertahan)}</div><div class="sub">belum bisa cair</div></div>
    <div class="kpi k-hijau"><div class="lab">Masih dalam target</div><div class="ang">${aman.length}</div><div class="sub">tidak perlu ditegur</div></div>
    <div class="kpi k-arang"><div class="lab">Belum mulai</div><div class="ang">${belum.length}</div><div class="sub">menunggu tutup progress</div></div>
  </div>

  <div class="kartu">
    <h3>Perlu ditindaklanjuti hari ini</h3>
    ${tl.length? tl.map(({t,h})=>{
      const akhir=(t.peringatan||[]).slice(-1)[0];
      return `<div class="tugas">
        <div class="tugas-kepala">
          <div>
            <div style="font-weight:800;font-size:17px">${esc(t.nama)}</div>
            <div style="font-size:13px;color:var(--teks2)">${esc(t.periode||'')} · ${esc(t.area||'')} · ${rupiah(t.nilai)}</div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:800;font-size:15px">Tahap ${h.tahapKini.no} — ${esc(h.tahapKini.nama)}</div>
            <div style="margin-top:5px">${chipPosisi(h)}</div>
          </div>
        </div>
        <div style="font-size:13.5px;color:var(--teks2);margin-top:10px">
          Ada di <b style="color:var(--teks)">${esc(h.picKini)}</b> sejak <b>${tglRapi(h.tglAkhir)}</b> ·
          sudah <b>${h.tahapKini.berjalan} hari kerja</b> dari target <b>${h.tahapKini.target} hari</b>
          ${t.catatan?`<br>Kendala: ${esc(t.catatan)}`:''}
          ${akhir?`<br><span style="color:var(--biru);font-weight:700">Terakhir diingatkan ${tglRapi(akhir.tgl)} oleh ${esc(akhir.oleh)}${akhir.cara?' ('+esc(akhir.cara)+')':''}</span>`:'<br><span style="color:var(--lambat);font-weight:700">Belum pernah diingatkan</span>'}
        </div>
        ${hanyaLihat?'':`<div class="tugas-aksi">
          <button class="tbl isi" data-pesan="${t.id}">Buat pesan peringatan</button>
          <button class="tbl hijau" data-ingat="${t.id}">Tandai sudah diingatkan</button>
          <button class="tbl kecil" data-catatan="${t.id}">Perbarui kendala</button>
        </div>`}
      </div>`;
    }).join('') : '<p class="kosong">Semua tagihan outstanding masih dalam target. Tidak ada yang perlu ditegur hari ini.</p>'}
  </div>

  <div class="kartu">
    <h3>Rekap peringatan per PIC</h3>
    ${(()=>{
      const peta={};
      tl.forEach(({t,h})=>{ const k=h.picKini; peta[k]=peta[k]||{n:0,hari:0,nilai:0,ingat:0};
        peta[k].n++; peta[k].hari+=h.lewat; peta[k].nilai+=(t.nilai||0);
        peta[k].ingat+=(t.peringatan||[]).length; });
      const u=Object.entries(peta).sort((a,b)=>b[1].hari-a[1].hari);

      return `<div class="gulung"><table><thead><tr><th>PIC</th><th>Tagihan telat</th><th>Total hari lewat</th><th>Nilai tertahan</th><th>Sudah diingatkan</th></tr></thead><tbody>
      ${u.map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td class="mono">${v.n}</td>

  gambarHadir('#bar-hadir-finance');

  document.querySelectorAll('[data-catatan]').forEach(b=>b.onclick=()=>formCatatan(b.dataset.catatan));

  `Diterima: ${tglRapi(h.tglAkhir)}\n`+
  `Berjalan: ${h.tahapKini.berjalan} hari kerja (target ${h.tahapKini.target} hari) — lewat ${h.lewat} hari\n\n`+
  `Mohon informasinya kapan bisa diselesaikan, atau apa kendalanya supaya kami bantu. Terima kasih.\n\nFinance — PT. BMKP`;
}
function formPesan(id){
  const t=DB.tagihan.find(x=>x.id===id); const h=hitung(t);
  const teks=pesanPeringatan(t,h);

  <div class="baris-form"><textarea id="j-pesan" rows="14" style="font-family:'JetBrains Mono',monospace;font-size:12.5px">${esc(teks)}</textarea></div>

    <button class="tbl" onclick="tutupJendela()">Tutup</button>
    <button class="tbl" id="j-salin">Salin teks</button>
    <button class="tbl isi" id="j-wa">Buka WhatsApp</button>
  </div>`);
  $('#j-salin').onclick=()=>{
    const ta=$('#j-pesan'); ta.select();
    try{ document.execCommand('copy'); roti('Pesan disalin.'); }catch(e){ roti('Salin manual dari kotak di atas.'); }
  };
  $('#j-wa').onclick=()=>{ window.open('https://wa.me/?text='+encodeURIComponent($('#j-pesan').value),'_blank'); };
}
function tandaiIngat(id){
  const t=DB.tagihan.find(x=>x.id===id); const h=hitung(t);
  bukaJendela(`<h3>Tandai sudah diingatkan</h3>
  <p style="color:var(--teks2);margin-top:-8px">${esc(t.nama)} → ${esc(h.picKini)}</p>

/* ---------- aksi bersama ---------- */
function isiTanggal(id,noTahap,tgl){
  if(!tgl){ roti('Tanggal belum dipilih.'); return; }
  const t=DB.tagihan.find(x=>x.id===id); if(!t) return;
  if(!bisaIsiTahap(noTahap)){ roti('Tahapan ini bukan wewenang Anda.'); return; }
  const th=cariTahap(noTahap);
  const sebelum=[...DB.tahapan].filter(x=>x.no<noTahap).reverse().map(x=>t.tgl[x.no]).find(Boolean);
  if(sebelum&&keDate(tgl)<keDate(sebelum)&&!confirm(`Tanggal ${tglRapi(tgl)} lebih awal dari tahapan sebelumnya (${tglRapi(sebelum)}). Tetap simpan?`)) return;
  t.tgl[noTahap]=tgl;
  const dur=sebelum?hariKerja(sebelum,tgl):0;
  catat('Isi tanggal',`${t.nama} · tahap ${noTahap} ${th.nama} · ${tglRapi(tgl)} (${dur} hari kerja, target ${th.target})`,t.id);
  simpanDB();
  dorong('simpanTanggal',{id:t.id,tahap:noTahap,namaTahap:th.nama,pic:th.pic,tanggal:tgl,oleh:SAYA.nama});
  lepasKunci();
  const h=hitung(t);
  roti(h.selesai?`${t.nama} selesai — pindah ke menu Tagihan Lunas.`:`Tersimpan. ${t.nama} sekarang di ${h.namaKini} (${h.picKini}).`);
  gambarSemua();
}

/* =======================================================================
   SAMBUNGAN SERVER · KEHADIRAN · KUNCI INPUT
   ======================================================================= */
const SERVER_URL_BAWAAN = 'https://script.google.com/macros/s/AKfycbxr6gIDMoT0qjKxbcsN_OoG6FRyxAGjry-G6o7Koxu8C46sKF8KusLyU9gqt4syJsT2/exec';   /* tempel URL Web App /exec di sini sebelum unggah ke GitHub */
const SERVER = {url:'', aktif:false, sibuk:false, online:[], kunci:[]};
let KUNCI_SAYA = null, DETAK = null;

function urlServer(){
  return SERVER.url || localStorage.getItem(KUNCI+'_url') || SERVER_URL_BAWAAN || '';
}
async function kirim(aksi, data, diam){
  const url=urlServer();
  if(!url) return {ok:false, pesan:'URL server belum diisi'};
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({aksi, data:data||{}, oleh:SAYA?SAYA.nama:''})});
    const j=await r.json();
    SERVER.aktif=true; lampuServer();
    return j;
  }catch(e){
    SERVER.aktif=false; lampuServer();
    if(!diam) console.warn('server:',aksi,e.message);
    return {ok:false, pesan:'Tidak tersambung ke server'};
  }
}
function antrikan(aksi,data){
  DB.antrian=DB.antrian||[];
  DB.antrian.push({aksi,data,waktu:new Date().toISOString(),oleh:SAYA?SAYA.nama:''});
  if(DB.antrian.length>300) DB.antrian.shift();
  simpanDB();
}
async function dorong(aksi,data){
  if(!urlServer()) return;
  const r=await kirim(aksi,data,true);
  if(!r||!r.ok){ antrikan(aksi,data); lampuServer(); }
}
async function kirimAntrian(){
  if(!urlServer()||!DB.antrian||!DB.antrian.length) return 0;
  let sukses=0;
  const sisa=[];
  for(const a of DB.antrian){
    const r=await kirim(a.aksi,a.data,true);
    if(r&&r.ok) sukses++; else sisa.push(a);
  }
  DB.antrian=sisa; simpanDB(); lampuServer();
  return sukses;
}
function lampuServer(){
  const el=document.getElementById('lampu-server'); if(!el) return;
  const antri=(DB.antrian||[]).length;
  el.className='server-lampu '+(urlServer()?(SERVER.aktif?'hidup':'mati'):'');
  const t=document.getElementById('teks-server');
  if(t) t.textContent = !urlServer()? 'Mode perangkat ini saja'
    : (SERVER.aktif? ('Tersambung ke server'+(antri?` · ${antri} antrean`:'')) : 'Server tidak terjangkau'+(antri?` · ${antri} antrean`:''));
}

/* ---- tarik seluruh data dari server ---- */
async function tarikServer(){
  const r=await kirim('tarik',{});
  if(!r||!r.ok) return false;
  if(r.tahapan&&r.tahapan.length) DB.tahapan=r.tahapan;
  if(r.libur) { DB.libur=r.libur; CACHE_LIBUR=null; }
  if(r.pengguna&&r.pengguna.length){
    /* server tidak mengirim sandi; sandi lokal dipertahankan untuk masuk saat jaringan mati */
    DB.pengguna=r.pengguna.map(p=>{
      const lama=DB.pengguna.find(x=>x.nama===p.nama);
      return Object.assign({}, p, {sandi: p.sandi || (lama?lama.sandi:'')});
    });
  }
  if(r.tagihan) DB.tagihan=r.tagihan.map(t=>Object.assign({peringatan:[],tgl:{}},t));
  if(r.log) DB.log=r.log;
  simpanDB();
  return true;
}

/* ---- kehadiran ---- */
async function detak(){
  if(!urlServer()||!SAYA) return;
  const r=await kirim('hadir',{nama:SAYA.nama,peran:SAYA.peran,halaman:halamanAktif},true);
  if(r&&r.ok){ SERVER.online=r.online||[]; SERVER.kunci=r.kunci||[]; }
  else SERVER.online=[];
  lampuServer();
  document.querySelectorAll('[data-bar-hadir]').forEach(el=>isiBarHadir(el));
}
function mulaiDetak(){
  if(DETAK) clearInterval(DETAK);
  detak(); DETAK=setInterval(detak, 25000);
}
function gambarHadir(sel){ const el=document.querySelector(sel); if(!el) return;
  el.setAttribute('data-bar-hadir','1'); isiBarHadir(el); }
function isiBarHadir(el){
  const daftar=SERVER.online.filter(o=>o.nama!==(SAYA?SAYA.nama:''));
  const kunciOrang=(SERVER.kunci||[]).filter(k=>k.oleh!==(SAYA?SAYA.nama:''));
  el.innerHTML=`
    ${kunciOrang.length?`<div class="kunci-pesan">Sedang diinput oleh ${kunciOrang.map(k=>esc(k.oleh)).join(', ')} — tombol isi tanggal untuk tagihan itu dikunci sementara agar tidak bentrok.</div>`:''}
    <div class="hadir-bar">
      <span style="color:var(--teks2);font-weight:700">Sedang membuka:</span>
      <span class="hadir-org"><span class="hadir-tit">${esc((SAYA?SAYA.nama:'?').slice(0,2)).toUpperCase()}</span>${esc(SAYA?SAYA.nama:'')} (Anda)</span>
      ${daftar.map(o=>`<span class="hadir-org"><span class="hadir-tit" style="background:var(--biru)">${esc(o.nama.slice(0,2)).toUpperCase()}</span>${esc(o.nama)}<span style="color:var(--teks2);font-weight:600">· ${esc(o.halaman||'')}</span></span>`).join('')}
      ${(!urlServer())?'<span style="color:var(--teks2)">— server belum disambungkan, daftar ini hanya menampilkan Anda</span>':(daftar.length?'':'<span style="color:var(--teks2)">— tidak ada orang lain</span>')}
    </div>`;
}

/* ---- kunci input ---- */
async function bukaTerkunci(idKunci, fn){
  if(urlServer()){
    const r=await kirim('kunciAmbil',{kunci:idKunci,oleh:SAYA.nama});
    if(r&&r.ok===false&&r.oleh){
      bukaJendela(`<h3>Sedang diinput orang lain</h3>
        <div class="kunci-pesan">${esc(r.oleh)} sedang membuka form untuk data ini. Untuk mencegah tanggal saling menimpa, Anda belum bisa menginput sekarang.</div>
        <p style="color:var(--teks2)">Coba lagi setelah ${esc(r.oleh)} menyimpan atau menutup formnya. Kunci otomatis terlepas setelah 5 menit tanpa aktivitas.</p>
        <div class="jendela-kaki"><button class="tbl isi" onclick="tutupJendela()">Mengerti</button></div>`);
      return;
    }
    KUNCI_SAYA=idKunci;
  }
  fn();
}
function lepasKunci(){
  if(KUNCI_SAYA&&urlServer()&&SAYA){ kirim('kunciLepas',{kunci:KUNCI_SAYA,oleh:SAYA.nama},true); }
  KUNCI_SAYA=null;
}

/* =======================================================================
   MASUK / KELUAR / MULAI
   ======================================================================= */
function isiPilihanNama(){
  $('#pilih-nama').innerHTML=DB.pengguna.filter(p=>p.aktif)
    .map(p=>`<option value="${esc(p.nama)}">${esc(p.nama)} — ${esc(p.jabatan||p.peran)}</option>`).join('');
}
async function coba(){
  const nama=$('#pilih-nama').value, sandi=$('#isi-sandi').value, g=$('#galat-masuk');
  g.style.display='none';
  if(urlServer()){
    const r=await kirim('masuk',{nama,sandi});
    if(r&&r.ok){
      SAYA={nama:r.nama||nama,peran:r.peran,jabatan:r.jabatan||''};
      if($('#ingat-saya').checked) localStorage.setItem(KUNCI+'_saya',JSON.stringify(SAYA));
      await tarikServer(); isiPilihanNama(); masuk(); return;
    }
    if(r&&r.pesan==='Sandi salah'){ g.textContent='Sandi salah. Hubungi Ariel atau Ati untuk atur ulang.'; g.style.display='block'; return; }
  }
  const p=DB.pengguna.find(u=>u.nama===nama&&u.aktif);
  if(!p||p.sandi!==sandi){ g.textContent='Sandi salah. Hubungi Ariel atau Ati untuk atur ulang.'; g.style.display='block'; return; }
  SAYA={nama:p.nama,peran:p.peran,jabatan:p.jabatan||''};
  if($('#ingat-saya').checked) localStorage.setItem(KUNCI+'_saya',JSON.stringify(SAYA));
  masuk();
}
function masuk(){
  $('#gerbang').classList.add('sembunyi');
  $('#aplikasi').classList.remove('sembunyi');
  $('#lencana-pengguna').textContent=SAYA.nama+(SAYA.jabatan?' · '+SAYA.jabatan:'');
  const m=menuSaya(); halamanAktif=m.length?m[0].id:'rekap';
  document.querySelectorAll('.halaman').forEach(h=>h.classList.remove('aktif'));
  $('#hal-'+halamanAktif).classList.add('aktif');
  catat('Masuk',''); simpanDB(); gambarSemua();
  if(urlServer()){ dorong('catatLog',{aksi:'Masuk',rinci:'',id:''}); mulaiDetak(); kirimAntrian(); }
}
$('#tbl-masuk').onclick=coba;
$('#isi-sandi').addEventListener('keydown',e=>{ if(e.key==='Enter') coba(); });
$('#tbl-keluar').onclick=()=>{
  lepasKunci(); if(DETAK) clearInterval(DETAK);
  if(urlServer()&&SAYA) kirim('pergi',{nama:SAYA.nama},true);
  localStorage.removeItem(KUNCI+'_saya'); SAYA=null;
  $('#aplikasi').classList.add('sembunyi'); $('#gerbang').classList.remove('sembunyi');
  $('#isi-sandi').value=''; $('#galat-masuk').style.display='none';
};

window.addEventListener('beforeunload',()=>{ try{ lepasKunci(); }catch(e){} });

(function mulai(){
  DB=bacaDB()||dbBaru();
  if(!DB.log) DB.log=[];
  if(!DB.libur) DB.libur=LIBUR_ASAL.map(x=>({tgl:x[0],nama:x[1]}));
  DB.tagihan.forEach(t=>{ if(!t.peringatan) t.peringatan=[]; });
  if(!DB.antrian) DB.antrian=[];
  SERVER.url = localStorage.getItem(KUNCI+'_url') || DB.serverUrl || SERVER_URL_BAWAAN || '';
  if(SERVER.url) localStorage.setItem(KUNCI+'_url',SERVER.url);
  CACHE_LIBUR=null; simpanDB();
  pasangLogo($('#logo-masuk')); pasangLogo($('#logo-kepala'));
  isiPilihanNama();
  try{ const s=JSON.parse(localStorage.getItem(KUNCI+'_saya')||'null');
    if(s&&DB.pengguna.some(p=>p.nama===s.nama&&p.aktif)){ SAYA=s; masuk(); } }catch(e){}
})();
</script>
